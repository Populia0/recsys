<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рекомендательная система целевой аудитории для таргетированной рекламы с учетом цветовых предпочтений</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="upload-screen" id="uploadScreen">
        <div class="upload-area">
            <p>Загрузите рекламное изображение, и система подберет подходящую целевую аудиторию на основе цветовых предпочтений</p>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
            <div class="preview" id="preview"></div>
            <button id="analyzeBtn" disabled>Анализировать</button>
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <div class="result-screen hidden" id="resultScreen">
        <div class="result-container">
            <!-- Левая секция с кнопкой и картинкой -->
            <div class="left-section">
                <button id="backBtn" class="back-btn-top">← Загрузить другое изображение</button>
                <div class="left-panel">
                    <img id="resultImg" class="result-image" alt="preview">
                    <div class="color-palette" id="colorPalette"></div>
                </div>
            </div>
            <!-- Правая панель с рекомендациями -->
            <div class="right-panel">
                <h3>Рекомендации по целевой аудитории</h3>
                <div id="recommendations" class="rec-card">
                    <p>Выберите цвет из палитры слева</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
